# Website (website/) über GitHub Pages: https://uzai77.github.io/Uzai/
# Einmal im öffentlichen Repository unter Settings › Pages › Source „GitHub Actions“ wählen.
# Läuft bei jeder Änderung in website/ auf main und von Hand (Actions › Website › Run workflow).
name: Website
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
